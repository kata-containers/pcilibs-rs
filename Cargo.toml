[package]
name = "pcilibs-rs"
version = "0.1.0"
description = "PCI device enumeration and diagnostics for Linux container runtimes"
keywords = ["kata", "container", "pci", "vfio"]
authors = ["The Kata Containers community <kata-dev@lists.katacontainers.io>"]
repository = "https://github.com/kata-containers/pcilibs-rs.git"
homepage = "https://katacontainers.io/"
readme = "README.md"
# src/cc/, src/gpu.rs, src/gpu/chips.rs and src/pci_dev.rs are MIT, carrying NVIDIA's copyright: they are a
# port of gpu-admin-tools. Everything else is Apache-2.0. Per-file SPDX
# headers say which is which.
license = "Apache-2.0 AND MIT"
edition = "2021"
# The newest thing the source asks for is io::ErrorKind::ResourceBusy.
rust-version = "1.83"

[features]
default = ["std"]
# Classification needs neither Linux access nor an allocator.
std = ["dep:libc", "dep:nix", "dep:phf", "dep:nom", "dep:phf_codegen", "dep:quote", "dep:proc-macro2"]
# Fake sysfs and /dev/vfio trees. For dev-dependencies only.
testfs = ["std", "dep:tempfile"]
# In-band NVIDIA confidential computing and Protected PCIe. Off by default:
# a consumer that only enumerates devices should not pull anyhow, and should
# not have to care that this exists.
cc = ["std", "dep:anyhow", "anyhow/std"]

[dependencies]
anyhow = { version = "1", default-features = false, optional = true }
# Already in the tree via nix; used directly for the BAR0 mmap.
libc = { version = "0.2", default-features = false, optional = true }
nix = { version = "0.31.3", default-features = false, features = ["fs"], optional = true }
phf = { version = "0.11", default-features = false, optional = true }
tempfile = { version = "3.19.1", optional = true }

[build-dependencies]
nom = { version = "7.1", default-features = false, optional = true }
phf_codegen = { version = "0.11", optional = true }
quote = { version = "1.0", default-features = false, optional = true }
proc-macro2 = { version = "1.0", default-features = false, optional = true }

[dev-dependencies]
rstest = "0.26"
tempfile = "3.19.1"

[[example]]
name = "platform"
required-features = ["std"]
